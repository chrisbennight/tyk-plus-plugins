services:
  gateway:
    # The test target adds a second proxy, governed2, at /mcp2/, a third,
    # governed3, at /mcp3/, and a fourth, governed4, at /mcp4/.
    build:
      target: test
    environment:
      <<: &test-gateway-environment
        MCP_UPSTREAM_URL: http://upstream:8000/mcp
        CEDAR_REFRESH_INTERVAL: 200ms
        # Plain HTTP is acceptable only on this isolated test network.
        MCP_TOKEN_JWKS_URL: http://issuer:8000/jwks
        MCP_TOKEN_ISSUER: https://issuer.test
        MCP_TOKEN_AUDIENCE: governed-mcp
        CEDAR_ROLES_CLAIM: app_roles
        # Token exchange on governed3 only, on both gateways, so it is also
        # tested on the peer, which has Code Mode off; governed4 also leaves
        # stripping off but is not listed. The test upstream is also the
        # token endpoint, over plain HTTP on this isolated test network.
        EXCHANGE_PROXIES: governed3=http://upstream:8000/mcp
        EXCHANGE_TOKEN_URL: http://upstream:8000/exchange
        EXCHANGE_ALLOW_INSECURE_HTTP: "true"
        EXCHANGE_CLIENT_ID: gateway
        EXCHANGE_CLIENT_SECRET: test-only-secret
        EXCHANGE_TIMEOUT: 3s
      # Code Mode on every proxy of this gateway only; the peer gateway has
      # it off. Runs use the sandbox host below.
      CODEMODE_SANDBOX_ADDRESS: sandbox:8443
      CODEMODE_SANDBOX_SERVER_NAME: sandbox
      CODEMODE_PROXIES: governed=/mcp/,governed2=/mcp2/,governed3=/mcp3/
      CODEMODE_BACKENDS: ${SANDBOX_BACKEND:-gvisor}
      CODEMODE_TLS_CERT: /etc/codemode/client.pem
      CODEMODE_TLS_KEY: /etc/codemode/client-key.pem
      CODEMODE_TLS_CA: /etc/codemode/client-ca.pem
    volumes:
      - policy:/opt/tyk-gateway/cedar:ro
      - status:/opt/tyk-gateway/cedar-status
      - pending:/opt/tyk-gateway/cedar-pending
      - sandbox-tls:/etc/codemode:ro
    depends_on:
      sandbox:
        condition: service_started
  # A second gateway sharing the store and drift review directory, so the
  # probe can check that a change one gateway sees is refused on the other.
  gateway-peer:
    extends:
      file: compose.yaml
      service: gateway
    # The same proxies as the gateway under test.
    build:
      target: test
    environment:
      <<: *test-gateway-environment
      # Its own name for the declarations it shares.
      CEDAR_GATEWAY_ID: gateway-peer
    ports: !reset []
    volumes: !override
      - policy:/opt/tyk-gateway/cedar:ro
      - peer-status:/opt/tyk-gateway/cedar-status
      - pending:/opt/tyk-gateway/cedar-pending
  upstream:
    build:
      context: ./tests
      # `upstream` speaks both protocol versions; `upstream-legacy` only the older one.
      target: ${UPSTREAM_TARGET:-upstream}
    environment:
      UPSTREAM_STREAM: ${UPSTREAM_STREAM:-}
      UPSTREAM_SESSIONS: ${UPSTREAM_SESSIONS:-}
  issuer:
    build: ./examples/issuer
    # The deck signs operators in to the review dashboard.
    environment:
      ISSUER_DECK: /deck.json
      ISSUER_PUBLIC_URL: http://issuer:8000
    volumes:
      - ./tests/issuer-deck.json:/deck.json:ro
  # The review dashboard, signing operators in through the test issuer and
  # reached through the gateway at /extensions/admin, as operators reach it.
  admin:
    profiles: !reset []
    # The probe writes the store as root in this stack.
    user: "0:0"
    environment:
      ADMIN_PUBLIC_URL: http://gateway:8080/extensions/admin
      ADMIN_OIDC_ISSUER: https://issuer.test
      ADMIN_OIDC_DISCOVERY_URL: http://issuer:8000
      # The test issuer has no TLS; this network is the test's own.
      ADMIN_OIDC_ALLOW_INSECURE_HTTP: "true"
      ADMIN_OIDC_CLIENT_ID: drift-review
      ADMIN_OIDC_CLIENT_SECRET: test-only-dashboard-secret
      ADMIN_OIDC_CLIENT_SECRET_FILE: ""
      ADMIN_REVIEWER_GROUP: drift-reviewers
      ADMIN_VIEWER_GROUP: drift-viewers
    volumes: !override
      - policy:/opt/tyk-gateway/cedar
      - pending:/opt/tyk-gateway/cedar-pending
  # The Code Mode sandbox host, as deployed, with test certificates.
  sandbox-launcher:
    extends:
      file: sandbox/compose.yaml
      service: sandbox-launcher
  sandbox:
    extends:
      file: sandbox/compose.yaml
      service: sandbox
    volumes: !override
      - sandbox-socket:/run/sandbox-launcher
      - sandbox-tls:/etc/sandbox/tls:ro
    depends_on:
      sandbox-launcher:
        condition: service_started
      sandbox-certs:
        condition: service_completed_successfully
  sandbox-certs:
    build:
      context: ./tests
      target: sandbox-probe
    command: ["certs", "/certs"]
    volumes:
      - sandbox-tls:/certs
  probe:
    build:
      context: ./tests
      target: probe
      # The probe runs the real cedar-policy, built from the plug-in source.
      additional_contexts:
        mcp-pdp: ./plugins/mcp-pdp
    environment:
      TYK_GW_SECRET: ${TYK_GW_SECRET:?}
      # The probe checks that the upstream behaves as this job declares.
      UPSTREAM_DISCOVERY: ${UPSTREAM_DISCOVERY:-newer}
      UPSTREAM_STREAM: ${UPSTREAM_STREAM:-}
      UPSTREAM_SESSIONS: ${UPSTREAM_SESSIONS:-}
    volumes:
      - policy:/policy
      - status:/status:ro
      - pending:/pending:ro
      - peer-status:/peer-status:ro
    depends_on:
      - gateway-peer
      - admin
volumes:
  sandbox-socket:
  sandbox-tls:
  policy:
  status:
  peer-status:
  pending:
