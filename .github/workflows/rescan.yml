name: Rescan release
# Vulnerabilities are found after a release ships. Each week, scan the latest
# release's SBOMs against a fresh vulnerability database with the release gate,
# and open an issue if they no longer pass.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions: {}
concurrency:
  group: rescan
  cancel-in-progress: false
# GitHub runs an explicit bash shell with pipefail, so a failing command
# piped into another still fails its step.
defaults:
  run:
    shell: bash

jobs:
  rescan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan the latest release
        run: |
          # The highest version, which latest names, not the most recent.
          tag=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1000 --json tagName --jq '.[].tagName' | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sort -V | tail -n 1)
          if [ -z "$tag" ]; then
            echo "No release to scan yet."
            exit 0
          fi
          mkdir sboms
          gh release download "$tag" --pattern '*.spdx.json' --dir sboms
          failed=()
          errors=()
          {
            echo "Scanned the SBOMs of $tag against today's vulnerability database."
            for sbom in sboms/*.spdx.json; do
              name=$(basename "$sbom" .spdx.json)
              echo
              echo "### $name"
              echo
              echo '```'
              # Status 3 means the scan found vulnerabilities; any other
              # failure is a scanner error, which fails the job but does not
              # stop the other images' findings from being reported.
              status=0
              release/scan.sh "$sbom" "$name.vulnerabilities.json" 2>&1 || status=$?
              echo '```'
              if [ "$status" -eq 3 ]; then
                failed+=("$name")
              elif [ "$status" -ne 0 ]; then
                errors+=("$name")
              fi
            done
          } > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          if [ ${#errors[@]} -ne 0 ]; then echo "::error::Could not scan: ${errors[*]}"; fi
          if [ ${#failed[@]} -ne 0 ]; then
            title="Release $tag has new vulnerabilities"
            if [ -n "$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[].number')" ]; then
              echo "An open issue already tracks $tag."
            else
              {
                echo "The weekly rescan found a critical vulnerability, or a high one with a fix, in: ${failed[*]}."
                echo "Release a fix, or record why the release is not affected in \`release/vex.json\`."
                echo
                cat report.md
              } > issue.md
              gh issue create --title "$title" --body-file issue.md
            fi
          fi
          # Fails if anything was found or could not be scanned.
          [ ${#failed[@]} -eq 0 ] && [ ${#errors[@]} -eq 0 ]
