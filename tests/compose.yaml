services:
  gateway:
    environment: &test-gateway-environment
      MCP_UPSTREAM_URL: http://upstream:8000/mcp
      CEDAR_REFRESH_INTERVAL: 200ms
      # Plain HTTP is acceptable only on this isolated test network.
      MCP_TOKEN_JWKS_URL: http://issuer:8000/jwks
      MCP_TOKEN_ISSUER: https://issuer.test
      MCP_TOKEN_AUDIENCE: governed-mcp
      CEDAR_ROLES_CLAIM: app_roles
    volumes:
      - policy:/opt/tyk-gateway/cedar:ro
      - status:/opt/tyk-gateway/cedar-status
      - pending:/opt/tyk-gateway/cedar-pending
  # A second gateway sharing the store and drift review directory, so the
  # probe can check that a change one gateway sees is refused on the other.
  gateway-peer:
    extends:
      file: compose.yaml
      service: gateway
    environment: *test-gateway-environment
    ports: !reset []
    volumes: !override
      - policy:/opt/tyk-gateway/cedar:ro
      - peer-status:/opt/tyk-gateway/cedar-status
      - pending:/opt/tyk-gateway/cedar-pending
  upstream:
    build:
      context: ./tests
      # `upstream` speaks both protocol versions; `upstream-legacy` only the older one.
      target: ${UPSTREAM_TARGET:-upstream}
    environment:
      UPSTREAM_STREAM: ${UPSTREAM_STREAM:-}
      UPSTREAM_SESSIONS: ${UPSTREAM_SESSIONS:-}
  issuer:
    build: ./examples/issuer
  probe:
    build:
      context: ./tests
      target: probe
    environment:
      TYK_GW_SECRET: ${TYK_GW_SECRET:?}
      # The probe checks that the upstream behaves as this job declares.
      UPSTREAM_DISCOVERY: ${UPSTREAM_DISCOVERY:-newer}
      UPSTREAM_STREAM: ${UPSTREAM_STREAM:-}
      UPSTREAM_SESSIONS: ${UPSTREAM_SESSIONS:-}
    volumes:
      - policy:/policy
      - status:/status:ro
      - pending:/pending:ro
      - peer-status:/peer-status:ro
    depends_on:
      - gateway-peer
volumes:
  policy:
  status:
  peer-status:
  pending:
