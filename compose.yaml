services:
  gateway:
    build:
      context: ./gateway
      additional_contexts:
        mcp-pdp: ./plugins/mcp-pdp
    environment:
      MCP_UPSTREAM_URL: ${MCP_UPSTREAM_URL:-http://upstream.invalid/mcp}
      CEDAR_REFRESH_INTERVAL: ${CEDAR_REFRESH_INTERVAL:-5s}
      CEDAR_STATUS_FILE: /opt/tyk-gateway/cedar-status/status.json
      # Token callers: leave these unset to accept keys only.
      MCP_TOKEN_JWKS_URL: ${MCP_TOKEN_JWKS_URL:-}
      MCP_TOKEN_ISSUER: ${MCP_TOKEN_ISSUER:-}
      MCP_TOKEN_AUDIENCE: ${MCP_TOKEN_AUDIENCE:-}
      CEDAR_ROLES_CLAIM: ${CEDAR_ROLES_CLAIM-roles}
      CEDAR_GROUPS_CLAIM: ${CEDAR_GROUPS_CLAIM-groups}
      CEDAR_SCOPES_CLAIM: ${CEDAR_SCOPES_CLAIM-scope}
      TYK_GW_SECRET: ${TYK_GW_SECRET:?Set a random local gateway admin secret}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
