services:
  gateway:
    build:
      context: ./gateway
      additional_contexts:
        mcp-pdp: ./plugins/mcp-pdp
        sandbox-protocol: ./sandbox/protocol
    environment:
      MCP_UPSTREAM_URL: ${MCP_UPSTREAM_URL:-http://upstream.invalid/mcp}
      CEDAR_REFRESH_INTERVAL: ${CEDAR_REFRESH_INTERVAL:-5s}
      CEDAR_STATUS_FILE: /opt/tyk-gateway/cedar-status/status.json
      # Drift review limits.
      CEDAR_PENDING_MAX_DEFINITION_BYTES: ${CEDAR_PENDING_MAX_DEFINITION_BYTES:-262144}
      CEDAR_PENDING_MAX_PER_PROXY: ${CEDAR_PENDING_MAX_PER_PROXY:-200}
      # Gateways sharing this directory refuse calls to a tool any of them saw
      # change, and queue changes there for review.
      CEDAR_PENDING_DIR: /opt/tyk-gateway/cedar-pending
      # Token callers: leave these unset to accept keys only.
      MCP_TOKEN_JWKS_URL: ${MCP_TOKEN_JWKS_URL:-}
      MCP_TOKEN_ISSUER: ${MCP_TOKEN_ISSUER:-}
      MCP_TOKEN_AUDIENCE: ${MCP_TOKEN_AUDIENCE:-}
      CEDAR_ROLES_CLAIM: ${CEDAR_ROLES_CLAIM-roles}
      CEDAR_GROUPS_CLAIM: ${CEDAR_GROUPS_CLAIM-groups}
      CEDAR_SCOPES_CLAIM: ${CEDAR_SCOPES_CLAIM-scope}
      # Code Mode stays off unless these are set; see gateway/code-mode.md.
      CODEMODE_SANDBOX_ADDRESS: ${CODEMODE_SANDBOX_ADDRESS:-}
      CODEMODE_SANDBOX_SERVER_NAME: ${CODEMODE_SANDBOX_SERVER_NAME:-}
      CODEMODE_PROXIES: ${CODEMODE_PROXIES:-}
      CODEMODE_BACKENDS: ${CODEMODE_BACKENDS:-}
      CODEMODE_TLS_CERT: ${CODEMODE_TLS_CERT:-}
      CODEMODE_TLS_KEY: ${CODEMODE_TLS_KEY:-}
      CODEMODE_TLS_CA: ${CODEMODE_TLS_CA:-}
      CODEMODE_GATEWAY_URL: ${CODEMODE_GATEWAY_URL:-}
      CODEMODE_MAX_RUN_MS: ${CODEMODE_MAX_RUN_MS:-}
      CODEMODE_MAX_CALL_MS: ${CODEMODE_MAX_CALL_MS:-}
      CODEMODE_MAX_MEMORY_BYTES: ${CODEMODE_MAX_MEMORY_BYTES:-}
      CODEMODE_MAX_CALLS: ${CODEMODE_MAX_CALLS:-}
      CODEMODE_MAX_CALLS_AT_ONCE: ${CODEMODE_MAX_CALLS_AT_ONCE:-}
      CODEMODE_MAX_PROGRAM_BYTES: ${CODEMODE_MAX_PROGRAM_BYTES:-}
      CODEMODE_MAX_CONSOLE_BYTES: ${CODEMODE_MAX_CONSOLE_BYTES:-}
      CODEMODE_MAX_VALUE_BYTES: ${CODEMODE_MAX_VALUE_BYTES:-}
      CODEMODE_MAX_RUNS: ${CODEMODE_MAX_RUNS:-}
      # Token exchange stays off unless these are set; see
      # gateway/token-exchange.md. A file named in EXCHANGE_CLIENT_SECRET_FILE
      # or EXCHANGE_TLS_CA must be mounted into the container, as with the
      # Code Mode certificates.
      EXCHANGE_PROXIES: ${EXCHANGE_PROXIES:-}
      EXCHANGE_TOKEN_URL: ${EXCHANGE_TOKEN_URL:-}
      EXCHANGE_ALLOW_INSECURE_HTTP: ${EXCHANGE_ALLOW_INSECURE_HTTP:-}
      EXCHANGE_TLS_CA: ${EXCHANGE_TLS_CA:-}
      EXCHANGE_CLIENT_ID: ${EXCHANGE_CLIENT_ID:-}
      EXCHANGE_CLIENT_SECRET_FILE: ${EXCHANGE_CLIENT_SECRET_FILE:-}
      EXCHANGE_CLIENT_SECRET: ${EXCHANGE_CLIENT_SECRET:-}
      EXCHANGE_TIMEOUT: ${EXCHANGE_TIMEOUT:-}
      EXCHANGE_EXPIRY_MARGIN: ${EXCHANGE_EXPIRY_MARGIN:-}
      EXCHANGE_CACHE_MAX_ENTRIES: ${EXCHANGE_CACHE_MAX_ENTRIES:-}
      # The review dashboard, which /extensions/admin routes to; see the
      # admin service below.
      ADMIN_UPSTREAM_URL: ${ADMIN_UPSTREAM_URL:-http://admin:8000}
      # The drift directory outlasts the container, so the gateway keeps one
      # name for its shared declarations however often it is recreated.
      CEDAR_GATEWAY_ID: ${CEDAR_GATEWAY_ID:-gateway}
      TYK_GW_SECRET: ${TYK_GW_SECRET:?Set a random local gateway admin secret}
      TYK_GW_NODESECRET: ${TYK_GW_NODESECRET:?Set a random secret shared by gateways that use the same Redis}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    # The policy store and the drift directory are volumes, so approvals and
    # queued changes outlast the container, and the review dashboard shares
    # them. A new volume starts with the image's contents. The gateway only
    # reads the store, so only reviewers, through the dashboard, change it.
    volumes:
      - policy:/opt/tyk-gateway/cedar:ro
      - pending:/opt/tyk-gateway/cedar-pending
    depends_on:
      redis:
        condition: service_healthy
  # The drift review dashboard, at http://127.0.0.1:8080/extensions/admin/.
  # It starts only with the admin profile: docker compose --profile admin up.
  # It signs operators in with your OpenID Connect identity provider; see
  # admin/README.md for the settings.
  admin:
    profiles: [admin]
    build:
      context: ./admin
      additional_contexts:
        mcp-pdp: ./plugins/mcp-pdp
        sandbox-protocol: ./sandbox/protocol
    environment:
      ADMIN_PUBLIC_URL: ${ADMIN_PUBLIC_URL:-}
      ADMIN_OIDC_ISSUER: ${ADMIN_OIDC_ISSUER:-}
      ADMIN_OIDC_DISCOVERY_URL: ${ADMIN_OIDC_DISCOVERY_URL:-}
      ADMIN_OIDC_ALLOW_INSECURE_HTTP: ${ADMIN_OIDC_ALLOW_INSECURE_HTTP:-}
      ADMIN_OIDC_CLIENT_ID: ${ADMIN_OIDC_CLIENT_ID:-}
      ADMIN_OIDC_CLIENT_SECRET_FILE: /run/secrets/admin-oidc-client-secret
      ADMIN_GROUPS_CLAIM: ${ADMIN_GROUPS_CLAIM:-groups}
      ADMIN_REVIEWER_GROUP: ${ADMIN_REVIEWER_GROUP:-}
      ADMIN_VIEWER_GROUP: ${ADMIN_VIEWER_GROUP:-}
    volumes:
      - policy:/opt/tyk-gateway/cedar
      - pending:/opt/tyk-gateway/cedar-pending
      - ${ADMIN_OIDC_CLIENT_SECRET_PATH:-./admin-oidc-client-secret}:/run/secrets/admin-oidc-client-secret:ro
    depends_on:
      - gateway
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
volumes:
  policy:
  pending:
