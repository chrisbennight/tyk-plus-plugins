# Example MCP servers through the local example gateway, as two key callers.
# Copy these tables into ~/.codex/config.toml, or into .codex/config.toml in a
# trusted project. The keys come from the environment; see examples/README.md.

[mcp_servers.directory_indexer]
url = "http://127.0.0.1:8080/directory/"
env_http_headers = { "X-API-Key" = "EXAMPLE_INDEXER_KEY" }

[mcp_servers.payments_indexer]
url = "http://127.0.0.1:8080/payments/"
env_http_headers = { "X-API-Key" = "EXAMPLE_INDEXER_KEY" }

[mcp_servers.notes_indexer]
url = "http://127.0.0.1:8080/notes/"
env_http_headers = { "X-API-Key" = "EXAMPLE_INDEXER_KEY" }

[mcp_servers.older_indexer]
url = "http://127.0.0.1:8080/older/"
env_http_headers = { "X-API-Key" = "EXAMPLE_INDEXER_KEY" }

[mcp_servers.changing_indexer]
url = "http://127.0.0.1:8080/changing/"
env_http_headers = { "X-API-Key" = "EXAMPLE_INDEXER_KEY" }

