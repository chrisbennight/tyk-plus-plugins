# Development backend for hosts where gVisor cannot run. It builds the image's
# "dev" target, the only one with runc. runc needs writable cgroups, so the
# launcher runs privileged; do not use this file in production.
services:
  sandbox-launcher:
    build:
      target: dev
    image: tyk-plus-plugins-sandbox-dev
    privileged: true
    environment:
      SANDBOX_BACKEND: runc
  sandbox:
    build:
      target: dev
    image: tyk-plus-plugins-sandbox-dev
