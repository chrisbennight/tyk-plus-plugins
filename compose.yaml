services:
  gateway:
    build:
      context: ./gateway
      additional_contexts:
        mcp-pdp: ./plugins/mcp-pdp
    environment:
      MCP_UPSTREAM_URL: ${MCP_UPSTREAM_URL:-http://upstream.invalid/mcp}
      CEDAR_REFRESH_INTERVAL: ${CEDAR_REFRESH_INTERVAL:-5s}
      CEDAR_STATUS_FILE: /opt/tyk-gateway/cedar-status/status.json
      # Drift review limits.
      CEDAR_PENDING_MAX_DEFINITION_BYTES: ${CEDAR_PENDING_MAX_DEFINITION_BYTES:-262144}
      CEDAR_PENDING_MAX_PER_PROXY: ${CEDAR_PENDING_MAX_PER_PROXY:-200}
      # Token callers: leave these unset to accept keys only.
      MCP_TOKEN_JWKS_URL: ${MCP_TOKEN_JWKS_URL:-}
      MCP_TOKEN_ISSUER: ${MCP_TOKEN_ISSUER:-}
      MCP_TOKEN_AUDIENCE: ${MCP_TOKEN_AUDIENCE:-}
      CEDAR_ROLES_CLAIM: ${CEDAR_ROLES_CLAIM-roles}
      CEDAR_GROUPS_CLAIM: ${CEDAR_GROUPS_CLAIM-groups}
      CEDAR_SCOPES_CLAIM: ${CEDAR_SCOPES_CLAIM-scope}
      TYK_GW_SECRET: ${TYK_GW_SECRET:?Set a random local gateway admin secret}
      TYK_GW_NODESECRET: ${TYK_GW_NODESECRET:?Set a random secret shared by gateways that use the same Redis}
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
  # Code Mode sandbox host, started with `--profile codemode`. In production it
  # runs on its own hosts; see sandbox/README.md.
  sandbox-launcher:
    profiles: [codemode]
    build: ./sandbox
    image: tyk-plus-plugins-sandbox
    entrypoint: ["/usr/local/bin/sandbox-launcher"]
    user: "0:0"
    network_mode: none
    read_only: true
    tmpfs:
      - /run/sandbox
      - /tmp
    # gVisor needs exactly these capabilities, and Docker's seccomp and
    # AppArmor profiles off, to create sandboxes without --privileged.
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, SETUID, SETGID, SETFCAP]
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - no-new-privileges:true
    environment:
      SANDBOX_BACKEND: ${SANDBOX_BACKEND:-gvisor}
      SANDBOX_SERVICE_UID: "10001"
    volumes:
      - sandbox-socket:/run/sandbox-launcher
    # All sandboxes on this host share these limits.
    mem_limit: ${SANDBOX_HOST_MEMORY:-4g}
    pids_limit: 2048
  sandbox:
    profiles: [codemode]
    build: ./sandbox
    image: tyk-plus-plugins-sandbox
    entrypoint: ["/usr/local/bin/sandbox-service"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      SANDBOX_CAPACITY: ${SANDBOX_CAPACITY:-8}
    volumes:
      - sandbox-socket:/run/sandbox-launcher
      - ${SANDBOX_TLS_DIR:-./sandbox/tls}:/etc/sandbox/tls:ro
    depends_on:
      - sandbox-launcher
volumes:
  sandbox-socket:
