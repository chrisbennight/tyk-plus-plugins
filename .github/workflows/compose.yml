name: Compose
on: [push, pull_request]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Both supported client versions run against each kind of upstream: one
    # that speaks both protocol versions, with plain or streamed replies; the
    # same server keeping sessions, which limits it to the older protocol; and a
    # server that only knows the older protocol.
    strategy:
      fail-fast: false
      matrix:
        # discovery: what server/discover does on that upstream.
        include:
          - {upstream: upstream, stream: "", sessions: "", discovery: newer}
          - {upstream: upstream, stream: "1", sessions: "", discovery: newer}
          - {upstream: upstream, stream: "1", sessions: "1", discovery: older-only}
          - {upstream: upstream-legacy, stream: "", sessions: "", discovery: unsupported}
          - {upstream: upstream-legacy, stream: "1", sessions: "1", discovery: unsupported}
    env:
      UPSTREAM_TARGET: ${{ matrix.upstream }}
      UPSTREAM_STREAM: ${{ matrix.stream }}
      UPSTREAM_SESSIONS: ${{ matrix.sessions }}
      UPSTREAM_DISCOVERY: ${{ matrix.discovery }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Cedar authorization through Tyk
        run: |
          export TYK_GW_SECRET="$(openssl rand -hex 32)"
          export TYK_GW_NODESECRET="$(openssl rand -hex 32)"
          export COMPOSE_FILE=compose.yaml:tests/compose.yaml
          trap 'docker compose down -v' EXIT
          docker compose build
          docker compose up -d gateway upstream issuer
          docker compose run --rm probe
          # The probe left `active` naming a rejected set. After a restart the
          # gateway has no valid set and must refuse every tool call.
          docker compose restart gateway
          docker compose run --rm -e PROBE_PHASE=restarted probe
      - name: Benchmark Cedar decisions
        if: matrix.upstream == 'upstream' && matrix.stream == '' && matrix.sessions == ''
        run: |
          # The benchmark starts no gateway; Compose still requires its secrets to be set.
          export TYK_GW_SECRET=unused TYK_GW_NODESECRET=unused
          docker compose run --rm --no-deps --entrypoint /opt/tyk-gateway/bin/cedar-policy gateway bench -synthetic -rules 1000 -proxies 10 -tools 1000
  shared-store:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish into a shared policy store as several users
        run: docker run --rm -v "$PWD":/w -w /w golang:1.26.10-trixie bash tests/shared-store.sh
  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Code Mode sandbox host with its production gVisor backend, launched
    # without --privileged, and with the runc development backend.
    strategy:
      fail-fast: false
      matrix:
        backend: [gvisor, runc]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify the sandbox host
        env:
          SANDBOX_BACKEND: ${{ matrix.backend }}
        run: |
          export COMPOSE_FILE=sandbox/compose.yaml:tests/sandbox.compose.yaml
          if [ "$SANDBOX_BACKEND" = runc ]; then COMPOSE_FILE="$COMPOSE_FILE:sandbox/compose.runc.yaml"; fi
          trap 'docker compose logs sandbox-launcher sandbox; docker compose down -v' EXIT
          docker compose build sandbox-launcher sandbox sandbox-certs sandbox-probe
          docker compose up -d sandbox-launcher sandbox
          docker compose run --rm sandbox-probe
