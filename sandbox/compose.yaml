# Code Mode sandbox host. It needs no gateway configuration, so it runs on its
# own: `docker compose -f sandbox/compose.yaml up -d`. See README.md here.
services:
  sandbox-launcher:
    build: .
    image: tyk-plus-plugins-sandbox
    entrypoint: ["/usr/local/bin/sandbox-launcher"]
    user: "0:0"
    network_mode: none
    read_only: true
    tmpfs:
      - /run/sandbox
      - /tmp
    # gVisor needs exactly these capabilities, and Docker's seccomp and
    # AppArmor profiles off, to create sandboxes without --privileged.
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, SETUID, SETGID, SETFCAP]
    security_opt:
      - seccomp=unconfined
      - apparmor=unconfined
      - no-new-privileges:true
    environment:
      SANDBOX_BACKEND: ${SANDBOX_BACKEND:-gvisor}
      SANDBOX_SERVICE_UID: "10001"
    volumes:
      - sandbox-socket:/run/sandbox-launcher
    # All sandboxes on this host share these limits.
    mem_limit: ${SANDBOX_HOST_MEMORY:-4g}
    pids_limit: 2048
    # Healthy while the launcher answers and its startup self-test passed.
    # The check runs as root here and switches to SANDBOX_SERVICE_UID before
    # asking, since the launcher answers no other user.
    healthcheck:
      test: ["CMD", "/usr/local/bin/sandbox-launcher", "-healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
      start_interval: 2s
  sandbox:
    build: .
    image: tyk-plus-plugins-sandbox
    entrypoint: ["/usr/local/bin/sandbox-service"]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      SANDBOX_CAPACITY: ${SANDBOX_CAPACITY:-8}
    volumes:
      - sandbox-socket:/run/sandbox-launcher
      - ${SANDBOX_TLS_DIR:-./tls}:/etc/sandbox/tls:ro
    depends_on:
      sandbox-launcher:
        condition: service_healthy
    # Healthy while the launcher can start sandboxes, which is when the
    # service takes runs.
    healthcheck:
      test: ["CMD", "/usr/local/bin/sandbox-service", "-healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s
      start_interval: 2s
volumes:
  sandbox-socket:
